[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miragessh"
version = "1.0.0"
description = "AI-Augmented Adaptive SSH Honeypot with Fake Shell, Deception Tarpit, and Real-Time MITRE ATT&CK Telemetry"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Security Engineering Team" }
]
keywords = [
    "honeypot",
    "ssh",
    "cybersecurity",
    "ai",
    "gemini",
    "threat-intelligence",
    "mitre-attack",
    "deception-technology",
    "soc",
    "forensics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "paramiko>=3.4.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
miragessh = "miragessh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
